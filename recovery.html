<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperação · CompeTIDOR</title>
<style>body{font:16px system-ui;background:#10171e;color:#e6edf3;max-width:640px;margin:10vh auto;padding:24px}main{background:#1a242e;border:1px solid #405160;border-radius:16px;padding:28px}button,a{padding:12px 16px;border-radius:8px;display:inline-block}button{background:#ffda00;color:#111;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}a{color:#a0d4ff}p{line-height:1.6}small{color:#a6bacb}</style>
<main><small>CONTAS · RECUPERAÇÃO</small><h1>Reinício de emergência</h1><p>Reinicia somente o CompeTIDOR. As operações em andamento podem ser interrompidas. Após o retorno, confira os resultados antes de repetir uma publicação ou alteração de preço.</p><p id="status" role="status">Verificando acesso…</p><button id="restart" disabled>Reiniciar aplicação</button><a href="/">Voltar à aplicação</a></main>
<script>
let csrf='',waiting=false;
const status=document.getElementById('status'), button=document.getElementById('restart');
async function check(){const response=await fetch('/recovery/status',{cache:'no-store',signal:AbortSignal.timeout(6000)});const data=await response.json();if(!response.ok)throw Error(data.error);csrf=data.csrf;status.textContent=(data.healthy?'Aplicação respondendo. ':'Aplicação sem resposta. ')+data.status;button.disabled=waiting||data.cooldown>0;return data;}
button.onclick=async()=>{if(!confirm('Confirma o reinício do CompeTIDOR? Operações em andamento poderão ser interrompidas.'))return;waiting=true;button.disabled=true;try{const response=await fetch('/recovery/restart',{method:'POST',headers:{'Content-Type':'application/json','X-Recovery-CSRF':csrf},body:JSON.stringify({confirm:'REINICIAR'}),signal:AbortSignal.timeout(10000)});const data=await response.json();if(!response.ok)throw Error(data.error);status.textContent='Reinício solicitado. Aguardando retorno…';for(let i=0;i<45;i++){await new Promise(r=>setTimeout(r,2000));const state=await check();if(!state.running&&state.healthy)return;}status.textContent='O retorno ainda não foi confirmado. Verifique o servidor; não repita operações de publicação sem conferir seus resultados.';}catch(e){status.textContent=e.message+' Reabra esta página para conferir o resultado; o reinício não será repetido automaticamente.';}finally{waiting=false;}};
check().catch(e=>{status.textContent=e.message;});
</script></html>
